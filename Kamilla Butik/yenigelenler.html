<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kamilla Butik - Yeni Gelenler</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Playfair Display", serif;
        margin: 0;
        padding: 0;
        background-color: white;
        background-image: url("images/cicek.jpg");
        background-repeat: no-repeat;
        background-size: cover;
        min-height: 100vh;
        color: #333;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .language-switcher {
        position: absolute;
        top: 10px;
        right: 20px;
        z-index: 1000;
      }
      .language-switcher img {
        width: 30px;
        margin-left: 10px;
        cursor: pointer;
        border-radius: 4px;
        border: 1px solid #ccc;
      }
      .page-title-wrapper {
        display: flex;
        justify-content: center;
        padding-top: 60px;
        padding-bottom: 30px;
      }
      .page-title {
        background-color: white;
        padding: 1rem 2rem;
        border-radius: 10px;
        font-size: 3rem;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      .product-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        padding: 30px;
      }
      .product-card {
        background: rgba(255, 255, 255, 0.9);
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        text-align: center;
      }
      .product-card img {
        max-width: 100%;
        height: auto;
        border-radius: 8px;
      }
      .product-card h3 {
        margin-top: 10px;
        font-size: 20px;
      }
      .product-card p {
        font-size: 16px;
        color: #666;
      }
      .back-home {
        text-align: center;
        padding: 30px 0;
      }
      .back-home a {
        background-color: white;
        padding: 1rem 2rem;
        border-radius: 10px;
        text-decoration: none;
        font-size: 1.6rem;
        font-weight: bold;
        color: #1f3b57;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        transition: 0.3s;
        display: inline-block;
      }
      .back-home a:hover {
        background-color: #1f3b57;
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="language-switcher">
      <img src="images/tr-flag.webp" alt="TR" onclick="setLanguage('tr')" />
      <img src="images/en-flag.webp" alt="EN" onclick="setLanguage('en')" />
    </div>

    <div class="page-title-wrapper">
      <h1 id="page-title" class="page-title">Yeni Gelenler</h1>
    </div>

    <div class="product-list" id="product-list"></div>

    <div class="back-home">
      <a href="index.html" id="back-button">🏡 Ana Sayfaya Dön</a>
    </div>

    <script>
      const translations = {
        tr: {
          title: "Yeni Gelenler",
          back: "🏡 Ana Sayfaya Dön",
        },
        en: {
          title: "New Arrivals",
          back: "🏡 Back to Home",
        },
      };

      function setLanguage(lang) {
        document.getElementById("page-title").textContent =
          translations[lang].title;
        document.getElementById("back-button").textContent =
          translations[lang].back;
      }

      setLanguage("tr");
    </script>
  </body>
</html>
