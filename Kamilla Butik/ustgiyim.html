<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kamilla Butik - Üst Giyim</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Playfair Display", serif;
        margin: 0;
        padding: 0;
        background-color: white;
        background-image: url("images/cicek.jpg");
        background-repeat: no-repeat;
        background-size: cover;
        min-height: 100vh;
        color: #333;
        display: flex;
        flex-direction: column;
      }

      .language-switcher {
        position: absolute;
        top: 10px;
        right: 20px;
        z-index: 1000;
      }

      .language-switcher img {
        width: 30px;
        margin-left: 10px;
        cursor: pointer;
        border-radius: 4px;
        border: 1px solid #ccc;
      }

      .page-title-wrapper {
        display: flex;
        justify-content: center;
        padding-top: 60px;
        padding-bottom: 10px;
      }

      .page-title {
        background-color: white;
        padding: 1rem 2rem;
        border-radius: 10px;
        font-size: 3rem;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }

      .product-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        padding: 30px;
      }

      .product-card {
        background: rgba(255, 255, 255, 0.9);
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        text-align: center;
        transition: 0.3s;
      }

      .product-card:hover {
        transform: scale(1.02);
      }

      .product-card img {
        max-width: 100%;
        height: auto;
        border-radius: 8px;
      }

      .product-card h3 {
        margin-top: 10px;
        font-size: 20px;
        color: #1f3b57;
      }

      .back-home {
        text-align: center;
        padding: 30px 0;
      }

      .back-home a {
        background-color: white;
        padding: 1rem 2rem;
        border-radius: 10px;
        text-decoration: none;
        font-size: 1.6rem;
        font-weight: bold;
        color: #1f3b57;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        transition: 0.3s;
      }

      .back-home a:hover {
        background-color: #1f3b57;
        color: white;
      }
    </style>
  </head>
  <body>
    <!-- Dil Seçici -->
    <div class="language-switcher">
      <img src="images/tr-flag.webp" alt="TR" onclick="setLanguage('tr')" />
      <img src="images/en-flag.webp" alt="EN" onclick="setLanguage('en')" />
    </div>

    <!-- Sayfa Başlığı -->
    <div class="page-title-wrapper">
      <h1 id="page-title" class="page-title">Üst Giyim</h1>
    </div>

    <!-- Ürün Listesi -->
    <div class="product-list" id="product-list"></div>

    <!-- Ana Sayfaya Dön -->
    <div class="back-home">
      <a href="index.html" id="back-button">🏡 Ana Sayfaya Dön</a>
    </div>

    <!-- Ürünleri Manuel Listele -->
    <script>
      const products = [
        {
          name_tr: "Kırmızı Ekose Bluz",
          name_en: "Red Plaid Blouse",
          image: "images/Bluz 1.jpeg",
        },
        {
          name_tr: "Kırmızı Desenli Bluz",
          name_en: "Red Patterned Blouse",
          image: "images/Bluz 2.jpeg",
        },
        {
          name_tr: "Kırmızı Şık Dantel Bluz",
          name_en: "Red Elegant Lace Blouse",
          image: "images/Bluz 3.jpeg",
        },
        {
          name_tr: "Mavi Şık Dantel Bluz",
          name_en: "Blue Elegant Lace Blouse",
          image: "images/Bluz 4.jpeg",
        },
        {
          name_tr: "Lacivert Pullu Bluz",
          name_en: "Navy Sequined Blouse",
          image: "images/Bluz 5.jpeg",
        },
        {
          name_tr: "Siyah Desenli Bluz",
          name_en: "Black Patterned Blouse",
          image: "images/Bluz 6.jpeg",
        },
        {
          name_tr: "Mavi Çiçek Desenli Bluz",
          name_en: "Blue Floral Blouse",
          image: "images/Bluz 7.jpeg",
        },
        {
          name_tr: "Siyah Bluz",
          name_en: "Black Blouse",
          image: "images/Bluz 8.jpeg",
        },
        {
          name_tr: "Turuncu Bluz",
          name_en: "Orange Blouse",
          image: "images/Bluz 9.jpeg",
        },
        {
          name_tr: "Pembe Desenli Bluz",
          name_en: "Pink Patterned Blouse",
          image: "images/Bluz 10.jpeg",
        },
        {
          name_tr: "Kırmızı Pembe Desenli Bluz",
          name_en: "Red & Pink Patterned Blouse",
          image: "images/Bluz 11.jpeg",
        },
        {
          name_tr: "Siyah Desenli Bluz",
          name_en: "Black Patterned Blouse",
          image: "images/Bluz 12.jpeg",
        },
        {
          name_tr: "Açık Mavi Çiçek Desenli Bluz",
          name_en: "Light Blue Floral Blouse",
          image: "images/Bluz 13.jpeg",
        },
      ];

      const list = document.getElementById("product-list");
      products.forEach((product, index) => {
        const div = document.createElement("div");
        div.className = "product-card";
        div.innerHTML = `
    <img src="${product.image}" alt="${product.name_tr}" />
    <h3 class="product-title" data-tr="${product.name_tr}" data-en="${product.name_en}">
      ${product.name_tr}
    </h3>
  `;
        list.appendChild(div);
      });
    </script>

    <!-- Dil Scripti -->
    <script>
      const translations = {
        tr: {
          title: "Üst Giyim",
          back: "🏡 Ana Sayfaya Dön",
        },
        en: {
          title: "Tops",
          back: "🏡 Back to Home",
        },
      };

      function setLanguage(lang) {
        localStorage.setItem("lang", lang);
        document.getElementById("page-title").textContent =
          translations[lang].title;
        document.getElementById("back-button").textContent =
          translations[lang].back;

        // Ürün isimlerini güncelle
        const productTitles = document.querySelectorAll(".product-title");
        productTitles.forEach((el) => {
          el.textContent = el.getAttribute(`data-${lang}`);
        });
      }

      const savedLang = localStorage.getItem("lang") || "tr";
      setLanguage(savedLang);
    </script>
  </body>
</html>
