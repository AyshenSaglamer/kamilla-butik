<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kamilla Butik - Ürünler</title>

    <!-- Font ve İkonlar -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Playfair Display", serif;
        margin: 0;
        padding: 0;
        background-color: white;
        background-image: url("images/cicek.jpg");
        background-repeat: no-repeat;
        background-size: cover;
        min-height: 100vh;
        color: #333;
        display: flex;
        flex-direction: column;
      }

      /* Dil Seçici */
      .language-switcher {
        position: absolute;
        top: 10px;
        right: 20px;
        z-index: 1000;
      }

      .language-switcher img {
        width: 30px;
        margin-left: 10px;
        cursor: pointer;
        border-radius: 4px;
        border: 1px solid #ccc;
      }

      .page-title-wrapper {
        display: flex;
        justify-content: center;
        padding-top: 40px;
        padding-bottom: 20px;
      }

      .page-title {
        background-color: white;
        padding: 1rem 2rem;
        border-radius: 10px;
        font-size: 3rem;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }

      /* Navbar */
      .navbar {
        display: flex;
        justify-content: center;
        gap: 1.5rem;
        padding: 1.5rem 1rem;
        background-color: rgba(255, 255, 255, 0.95);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        flex-wrap: wrap;
      }

      .navbar a {
        font-size: 1.6rem;
        text-decoration: none;
        color: #1f3b57;
        font-weight: 600;
        padding: 0.8rem 1.2rem;
        border-radius: 6px;
        transition: all 0.3s ease;
      }

      .navbar a:hover {
        background-color: #1f3b57;
        color: white;
      }

      .product-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        padding: 30px;
      }

      .product-card {
        background: rgba(255, 255, 255, 0.9);
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        text-align: center;
      }

      .product-card img {
        max-width: 100%;
        height: auto;
        border-radius: 8px;
      }

      .product-card h3 {
        margin-top: 10px;
        font-size: 20px;
      }

      .product-card p {
        font-size: 16px;
        color: #666;
      }

      .back-home {
        text-align: center;
        padding: 30px 0;
      }

      .back-home a {
        background-color: white;
        padding: 1rem 2rem;
        border-radius: 10px;
        text-decoration: none;
        font-size: 1.6rem;
        font-weight: bold;
        color: #1f3b57;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        transition: 0.3s;
        display: inline-block;
      }

      .back-home a:hover {
        background-color: #1f3b57;
        color: white;
      }
    </style>
  </head>
  <body>
    <!-- Dil Seçici -->
    <div class="language-switcher">
      <img src="images/tr-flag.webp" alt="TR" onclick="setLanguage('tr')" />
      <img src="images/en-flag.webp" alt="EN" onclick="setLanguage('en')" />
    </div>

    <!-- Başlık -->
    <div class="page-title-wrapper">
      <h1 id="page-title" class="page-title">Tüm Ürünler</h1>
    </div>

    <!-- NAVBAR alt kısma kondu -->
    <div class="navbar lang lang-tr">
      <a href="elbiseler.html">Elbiseler</a>
      <a href="tulumlar.html">Tulumlar</a>
      <a href="ustgiyim.html">Üst Giyim</a>
      <a href="altgiyim.html">Alt Giyim</a>
      <a href="takimlar.html">Takımlar</a>
      <a href="ceket.html">Ceket / Kaban</a>
      <a href="aksesuarlar.html">Aksesuarlar</a>
      <a href="cantalar.html">Çantalar</a>
      <a href="abiye.html">Abiye</a>
    </div>

    <div class="navbar lang lang-en" style="display: none">
      <a href="elbiseler.html">Dresses</a>
      <a href="tulumlar.html">Jumpsuits</a>
      <a href="ustgiyim.html">Tops</a>
      <a href="altgiyim.html">Bottoms</a>
      <a href="takimlar.html">Sets</a>
      <a href="ceket.html">Jackets & Coats</a>
      <a href="aksesuarlar.html">Accessories</a>
      <a href="cantalar.html">Bags</a>
      <a href="abiye.html">Evening Dresses</a>
    </div>

    <!-- Ürün Listesi -->
    <div class="product-list" id="product-list"></div>

    <!-- Ana Sayfaya Dön Butonu -->
    <div class="back-home">
      <a href="index.html" id="back-button">🏡 Ana Sayfaya Dön</a>
    </div>

    <!-- Dil Scripti -->
    <script>
      const translations = {
        tr: {
          title: "Tüm Ürünler",
          back: "🏡 Ana Sayfaya Dön",
        },
        en: {
          title: "All Products",
          back: "🏡 Back to Home",
        },
      };

      function setLanguage(lang) {
        document.getElementById("page-title").textContent =
          translations[lang].title;
        document.getElementById("back-button").textContent =
          translations[lang].back;

        document.querySelectorAll(".lang").forEach((el) => {
          el.style.display = "none";
        });
        document
          .querySelectorAll(".lang-" + lang)
          .forEach((el) => (el.style.display = "flex"));
      }

      setLanguage("tr");
    </script>
  </body>
</html>
